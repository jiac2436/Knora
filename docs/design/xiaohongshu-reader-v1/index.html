<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小红书阅读页 · 三套设计方案</title>
<style>
:root{color-scheme:dark;--bg:#191919;--surface:#232323;--line:#343434;--text:#e8e8e8;--muted:#969696;--accent:#bcb8ec;--selected:#464267}*{box-sizing:border-box}body{margin:0;background:#101112;color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,a{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:disabled{opacity:.3;cursor:default}.design-bar{max-width:1380px;margin:28px auto 20px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}.label{color:#a4a1ac;font-size:12px;letter-spacing:.1em}.design-bar strong{font-size:20px;font-weight:600}.switch{display:flex;padding:4px;border:1px solid #35343c;border-radius:12px;background:#1c1d20;gap:4px}.switch button{padding:10px 20px;border-radius:8px;color:#a9a9b0;font-size:14px}.switch button[aria-selected=true]{background:#3d3a51;color:#eeeafa}.explain{max-width:1332px;margin:0 auto 22px;color:#ababaf;padding:0 0 0 2px;min-height:28px;font-size:14px}.explain strong{color:#d8d5ed;font-weight:500}.shell{max-width:1332px;margin:0 auto;background:var(--bg);border:1px solid #38383b;border-radius:13px;overflow:hidden;box-shadow:0 28px 80px #0005}.toolbar{height:66px;padding:0 22px;display:flex;align-items:center;border-bottom:1px solid var(--line);gap:14px}.toolbar svg{width:20px;height:20px;stroke:#bbb;fill:none;stroke-width:1.5}.icon-button{height:34px;width:34px;display:grid;place-content:center;border-radius:7px}.icon-button:hover{background:#303030}.type{font-size:11px;color:var(--accent);background:#2a2837;border-radius:5px;padding:3px 8px}.toolbar h1{font-size:17px;line-height:1.4;margin:0;font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;flex:1}.reading-toggle{display:flex;border-radius:6px;overflow:hidden;background:#343434;font-size:12px}.reading-toggle span{padding:3px 13px}.reading-toggle .chosen{background:#4d487c;color:#f4f2ff}.workspace{height:735px;overflow:auto;scrollbar-color:#424242 transparent;scrollbar-width:thin}.source-line{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin-bottom:28px}.brand{width:36px;height:24px;display:inline-grid;place-items:center;background:#e64458;color:white;font-size:10px;font-weight:650;border-radius:6px;letter-spacing:-1px}.avatar{width:24px;height:24px;border-radius:50%;background:#5c6057;color:#eee;font-size:11px;display:inline-grid;place-items:center}.source-link{margin-left:auto;color:#b0adb8;text-decoration:none}.copy{font-size:17px;line-height:1.95;letter-spacing:.015em}.copy p{margin:0 0 17px}.topics{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 30px}.topic{color:#aaa6c4;font-size:12px;padding:2px 9px;border-radius:5px;background:#27252e}.section-head{display:flex;align-items:baseline;gap:10px;font-size:14px;font-weight:550;margin:26px 0 14px}.section-head small{color:var(--muted);font-size:12px;font-weight:400}.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.media-tile{padding:0;position:relative;overflow:hidden;border-radius:8px;background:#303232;text-align:left}.media-tile svg{width:100%;height:100%;display:block}.media-tile .num{position:absolute;right:9px;top:9px;background:#15161699;border-radius:12px;padding:0 8px;color:white;font:11px/22px ui-monospace,monospace}.media-tile:hover{outline:1px solid #a8a3bd}.comment-summary{border-top:1px solid var(--line);margin-top:32px;padding-top:20px}.comment-summary summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;font-size:14px}.comment-summary summary::-webkit-details-marker{display:none}.chevron{color:var(--muted);font-size:13px;transition:transform .15s}.comment-summary[open] .chevron{transform:rotate(90deg)}.comment-summary summary small{color:var(--muted);font-size:12px;margin-left:auto}.coverage{font-size:12px;color:#99919e;margin:12px 0 20px}.comment{padding:16px 0;border-bottom:1px solid #2b2b2b}.comment-author{font-size:12px;color:#a4a1ab;display:flex;gap:8px;align-items:center;min-width:0}.comment-author .name{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.comment-text{font-size:14px;margin:6px 0 0 32px;line-height:1.8}.reply{margin:12px 0 0 32px;border-left:2px solid #494552;padding:0 0 0 15px}.reply .comment-text{margin-left:0}.author-badge{font-size:10px;background:#3a3548;color:#c0b9dd;border-radius:3px;padding:0 5px}.article{max-width:820px;margin:auto;padding:34px 22px 54px}.article .media-tile{height:224px}.caption{font-size:11px;color:#777;margin:9px 0 0}.split{display:grid;grid-template-columns:54% 46%;height:100%;overflow:hidden}.gallery-pane{background:#141515;padding:26px 38px;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}.gallery-stage{flex:1;min-height:0;position:relative;display:flex;justify-content:center}.gallery-stage>.media-tile{height:100%;max-width:440px;width:100%;border-radius:6px}.gallery-nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:17px;color:#aaa;font-size:12px}.gallery-nav button{border:1px solid #393939;border-radius:50%;width:30px;height:30px;font-size:17px}.text-pane{padding:30px 32px;overflow:auto;scrollbar-width:thin}.text-pane .source-line{margin-bottom:22px;flex-wrap:wrap}.text-pane .copy{font-size:16px}.text-pane .topics{margin-bottom:26px}.subtabs{display:flex;border-bottom:1px solid var(--line);gap:24px;margin-bottom:23px}.subtabs button{font-size:13px;color:#999;padding:0 0 11px;position:relative}.subtabs button[aria-selected=true]{color:#ddd9fa}.subtabs button[aria-selected=true]:after{content:"";position:absolute;height:2px;background:#b4addd;left:0;right:0;bottom:-1px}.sectioned{max-width:920px;margin:auto;padding:28px 28px 50px}.sectioned>.source-line{margin-bottom:25px}.sectioned .subtabs{position:sticky;top:-1px;background:var(--bg);padding-top:6px;z-index:2}.sectioned-content{max-width:760px;margin:auto}.sectioned .copy{padding-top:14px}.quiet-count{color:#888;font:11px ui-monospace,monospace;margin-left:5px}.image-tab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.image-tab-grid .media-tile{height:330px}.footer{max-width:1332px;margin:20px auto 26px;color:#8f8e99;font-size:12px;display:flex;justify-content:space-between;gap:20px}.footer em{font-style:normal;color:#bbb6d2}.hidden,[hidden]{display:none!important}dialog{background:#191b1d;color:#ddd;border:1px solid #4a4a4a;border-radius:12px;width:min(730px,90vw);padding:18px}dialog::backdrop{background:#000b}dialog header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px}dialog .dialog-image{max-height:72vh;overflow:auto;text-align:center}dialog svg{max-width:100%;width:480px;display:block;margin:auto}.dialog-bottom{display:flex;justify-content:center;gap:18px;margin-top:12px}.dialog-bottom button{background:#303136;padding:5px 20px;border-radius:6px}.close{font-size:22px}svg text{font-family:-apple-system,"PingFang SC",sans-serif}@media(max-width:900px){.design-bar{flex-direction:column;align-items:flex-start}.explain,.footer{margin-left:24px;margin-right:24px}.shell{margin:0 16px}.switch button{padding:8px 12px}.toolbar{padding:0 12px;gap:8px}.toolbar h1{font-size:14px}.reading-toggle,.toolbar .extra{display:none}.split{grid-template-columns:1fr;height:auto}.gallery-pane{height:480px;border-right:0;border-bottom:1px solid var(--line)}.workspace{height:720px}.media-grid,.image-tab-grid{grid-template-columns:repeat(3,1fr);gap:8px}.article .media-tile{height:160px}.footer{display:block}.source-line{gap:7px}.text-pane{overflow:visible}.image-tab-grid .media-tile{height:220px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<body><div class="design-bar"><div><div class="label">小红书专属阅读页 · 设计预览</div><strong>同一条笔记，三种阅读方式</strong></div><div class="switch" role="tablist" aria-label="切换设计方案"><button role="tab" aria-selected="true" data-mode="article">A · 阅读优先</button><button role="tab" aria-selected="false" data-mode="split">B · 图文对照</button><button role="tab" aria-selected="false" data-mode="sectioned">C · 分区切换</button></div></div>
<div class="explain" id="explain"></div>
<div class="shell"><header class="toolbar"><button class="icon-button" aria-label="侧栏（静态示意）"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M5 8h2M5 11h2"/></svg></button><span class="type">链接</span><h1>三亚旅游后我的真实感受 😅 仅个人观点</h1><button class="icon-button extra" aria-label="讨论（静态示意）"><svg viewBox="0 0 24 24"><path d="M4 4h15v12H11l-5 4v-4H4z"/></svg></button><button class="icon-button extra" aria-label="AI 分析（静态示意）"><svg viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg></button><div class="reading-toggle"><span class="chosen">阅读</span><span>编辑</span></div><button class="icon-button" aria-label="更多（静态示意）">···</button></header><div class="workspace" id="workspace"></div></div>
<div class="footer"><span id="tradeoff"></span><span>设计样稿 · 配图及数量仅作布局示意 · 未修改正式 App</span></div>
<dialog id="lightbox"><header><span id="image-count"></span><button class="close" aria-label="关闭">×</button></header><div class="dialog-image"></div><div class="dialog-bottom"><button data-direction="-1">← 上一张</button><button data-direction="1">下一张 →</button></div></dialog>
<script>
const artwork=[
`<svg viewBox="0 0 360 480" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="480" fill="#bbd7dc"/><path d="M160-10Q105 75 154 130T182 245T260 365L345 480H380V-10Z" fill="#ece6d5"/><path d="M206 46Q154 93 202 152T238 273T306 395" fill="none" stroke="#e7b091" stroke-width="5"/><path d="M206 46Q154 93 202 152T238 273T306 395" fill="none" stroke="#a56d59" stroke-width="1.5" stroke-dasharray="4 6"/><g fill="#455b59"><circle cx="200" cy="66" r="5"/><circle cx="184" cy="175" r="5"/><circle cx="239" cy="289" r="5"/><circle cx="291" cy="375" r="5"/></g><g fill="#425a56" font-size="17"><text x="216" y="71">海边散步</text><text x="204" y="180">城市漫游</text><text x="255" y="294">落日时分</text><text x="222" y="410">海湾夜色</text></g><text x="30" y="65" fill="#42676f" font-size="35" font-weight="600">三亚</text><text x="30" y="91" fill="#65878c" font-size="11">海岛行程 / 图片示意</text><path d="M30 320q40-20 74 0m-70 20q30-15 60 0" stroke="#96c1ca" fill="none"/><text x="27" y="453" fill="#607b7d" font-size="10">示例配图，非原帖路线</text></svg>`,
`<svg viewBox="0 0 360 480" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="480" fill="#e2d5bb"/><path d="M0 260Q115 220 360 248V480H0Z" fill="#93b9b6"/><path d="M0 320Q170 280 360 320V480H0Z" fill="#73a4a8"/><circle cx="267" cy="201" r="41" fill="#e9b995"/><path d="M0 320q120-25 230 0" fill="none" stroke="#c8ded9" stroke-width="2"/><text x="27" y="61" fill="#5f655d" font-size="27" font-weight="500">海岛慢一点</text><text x="29" y="88" fill="#77766b" font-size="12">把时间留给海风与日落</text><text x="29" y="453" fill="#375e64" font-size="10">示例配图，非原帖照片</text></svg>`,
`<svg viewBox="0 0 360 480" xmlns="http://www.w3.org/2000/svg"><rect width="360" height="480" fill="#d9d1c7"/><text x="29" y="64" fill="#57514d" font-size="28" font-weight="600">旅行备忘</text><text x="30" y="91" fill="#8d8072" font-size="11">看完后，留下真正有用的部分</text><g fill="none" stroke="#b4a89a"><path d="M30 147h300M30 227h300M30 307h300M30 387h300"/></g><g fill="#625c55" font-size="17"><text x="31" y="181">看清行程中的隐藏费用</text><text x="31" y="261">给自由活动留出时间</text><text x="31" y="341">提前核对出行信息</text></g><text x="29" y="451" fill="#8d8072" font-size="10">示例排版，非原帖内容</text></svg>`];
const source=()=>`<div class="source-line"><span class="brand">小红书</span><span class="avatar">爆</span><span>爱美的爆米花</span><span>·</span><span>网页采集</span><a class="source-link" href="https://www.xiaohongshu.com/" target="_blank" rel="noreferrer">查看来源 ↗</a></div>`;
const prose=()=>`<div class="copy"><p>结束三亚旅程返程，说几句大实话。海景风光无可挑剔，可一路上踩了不少隐形套路。</p><p>内容仅代表个人真实游玩经历，整理出来就是想帮打算出行的朋友避开这些糟心事，旅途少走弯路、尽兴游玩。</p></div>`;
const topics=()=>`<div class="topics">${['三亚旅游','三亚旅游攻略','椰梦长廊','三亚旅行','三亚特色美食','三亚避坑'].map(s=>`<span class="topic"># ${s}</span>`).join('')}</div>`;
const tiles=()=>artwork.map((s,i)=>`<button class="media-tile" data-image="${i}" aria-label="查看示例图片 ${i+1}">${s}<span class="num">${i+1} / 3</span></button>`).join('');
const comments=()=>`<p class="coverage">已采集 18 条评论及回复，原帖显示共 55 条；仅展示已加载的内容。</p><div class="comment"><div class="comment-author"><span class="avatar">用</span><span class="name" title="用户已注销">用户已注销</span></div><div class="comment-text">请问您的酒店住在哪个湾呀</div></div><div class="comment"><div class="comment-author"><span class="avatar">岁</span><span class="name">岁岁日常集</span></div><div class="comment-text">不用自己做攻略，直接照搬就行了</div><div class="reply"><div class="comment-author"><span class="name">爱美的爆米花</span><span class="author-badge">作者</span></div><div class="comment-text">是啊，一路踩坑总结出来的路线</div></div></div><div class="comment"><div class="comment-author"><span class="avatar">紫</span><span class="name">紫色秋屿</span></div><div class="comment-text">逛吃两不误，休闲又放松，一点都不会觉得累</div><div class="reply"><div class="comment-author"><span class="name">爱美的爆米花</span><span class="author-badge">作者</span></div><div class="comment-text">休闲娱乐放松，一应俱全</div></div></div>`;
let mode='article',galleryIndex=0;
const explanations={article:'<strong>推荐 · 阅读优先</strong>　先读正文，图片紧随其后；评论默认收起，按需展开。',split:'<strong>图文对照</strong>　图片与文字并排，适合看攻略长图；正文和评论在右侧独立切换。',sectioned:'<strong>分区切换</strong>　正文、图片、评论各有独立页面，一次只看一种内容。'};
const tradeoffs={article:'适合多数收藏：保留连续阅读，<em>评论不会抢占首屏。</em>',split:'适合图片信息密集的笔记：<em>图文可同时参考</em>；窄窗口需要上下排列。',sectioned:'适合专注检索与阅读：<em>内容最干净</em>；跨区参考需要切换标签。'};
function render(){document.querySelector('#explain').innerHTML=explanations[mode];document.querySelector('#tradeoff').innerHTML=tradeoffs[mode];document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===mode)));const w=document.querySelector('#workspace');w.scrollTop=0;
if(mode==='article')w.innerHTML=`<main class="article">${source()}${prose()}${topics()}<div class="section-head">图片 <small>3 张 · 点击查看大图</small></div><div class="media-grid">${tiles()}</div><p class="caption">图片按原帖顺序展示</p><details class="comment-summary"><summary><span class="chevron">›</span>评论与回复 <span class="quiet-count">18</span><small>展开查看</small></summary>${comments()}</details></main>`;
if(mode==='split')w.innerHTML=`<main class="split"><section class="gallery-pane"><div class="gallery-stage"><button class="media-tile" data-image="${galleryIndex}" aria-label="查看当前大图">${artwork[galleryIndex]}<span class="num">${galleryIndex+1} / 3</span></button></div><div class="gallery-nav"><button data-step="-1" aria-label="上一张">‹</button><span>图片 ${galleryIndex+1} / 3</span><button data-step="1" aria-label="下一张">›</button></div></section><section class="text-pane">${source()}<div class="subtabs" role="tablist"><button role="tab" data-split-tab="body" aria-selected="true">笔记正文</button><button role="tab" data-split-tab="comments" aria-selected="false">评论 <span class="quiet-count">18</span></button></div><div id="split-content">${prose()}${topics()}</div></section></main>`;
if(mode==='sectioned')w.innerHTML=`<main class="sectioned">${source()}<div class="subtabs" role="tablist"><button role="tab" data-section-tab="body" aria-selected="true">正文</button><button role="tab" data-section-tab="images" aria-selected="false">图片 <span class="quiet-count">3</span></button><button role="tab" data-section-tab="comments" aria-selected="false">评论 <span class="quiet-count">18</span></button></div><div class="sectioned-content" id="section-content">${prose()}${topics()}</div></main>`;}
let activeImage=0;const dialog=document.querySelector('#lightbox');function paintImage(){document.querySelector('#image-count').textContent=`示例图片 ${activeImage+1} / 3`;document.querySelector('.dialog-image').innerHTML=artwork[activeImage];dialog.querySelector('[data-direction="-1"]').disabled=activeImage===0;dialog.querySelector('[data-direction="1"]').disabled=activeImage===2;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){mode=b.dataset.mode;render();}if(b.dataset.step){galleryIndex=Math.max(0,Math.min(2,galleryIndex+Number(b.dataset.step)));render();}if(b.dataset.splitTab){document.querySelectorAll('[data-split-tab]').forEach(t=>t.setAttribute('aria-selected',String(t===b)));document.querySelector('#split-content').innerHTML=b.dataset.splitTab==='body'?prose()+topics():comments();}if(b.dataset.sectionTab){document.querySelectorAll('[data-section-tab]').forEach(t=>t.setAttribute('aria-selected',String(t===b)));document.querySelector('#section-content').innerHTML=b.dataset.sectionTab==='body'?prose()+topics():b.dataset.sectionTab==='images'?`<div class="image-tab-grid">${tiles()}</div>`:comments();}if(b.dataset.image!==undefined){activeImage=Number(b.dataset.image);paintImage();dialog.showModal();}if(b.dataset.direction){activeImage=Math.max(0,Math.min(2,activeImage+Number(b.dataset.direction)));paintImage();}if(b.classList.contains('close'))dialog.close();});
document.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key)||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(dialog.open){activeImage=Math.max(0,Math.min(2,activeImage+(e.key==='ArrowRight'?1:-1)));paintImage();e.preventDefault();}else if(mode==='split'){galleryIndex=Math.max(0,Math.min(2,galleryIndex+(e.key==='ArrowRight'?1:-1)));render();e.preventDefault();}});render();
</script></body></html>
