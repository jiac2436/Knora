<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knora · 本地连接</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="icons/icon-32.png" type="image/png"></head><body class="options-body"><main class="options-shell"><div class="help-brand"><img src="icons/icon-48.png" width="44" height="44" alt=""><p class="eyebrow">浏览器插件设置</p></div><p><a class="options-help" href="help.html">查看使用说明 →</a></p><h1>连接本地知识库</h1><p class="lede">打开插件自动发现本机 Knora，无需登录、绑定账户或填写访问令牌。</p><section class="current-account"><span class="muted">本地连接</span><strong id="current-account">正在检查…</strong></section><p id="status" class="status" role="status"></p><button id="connect" class="primary" type="button">启动 App 并重新连接</button><aside class="notice"><strong>App 未启动时</strong><p>首次安装需要注册 Chrome / Edge 本地桥接，未安装时需先完成本地连接组件配置，详见使用说明。之后可以从插件直接唤起 App。已有连接会保留；已读取的知识域可用于离线保存，App 启动后再同步。</p><p>重新安装或更换扩展目录时，需更新连接组件。请按使用说明中的开发版安装步骤操作。</p><p id="queue-info"></p></aside></main><script type="module" src="options.js"></script></body></html>
