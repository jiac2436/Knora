<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="1024" height="1024"><defs>
      <!-- 1. 黑曜石深邃基底 -->
      <linearGradient id="bg-black" x1="100" y1="10" x2="100" y2="190" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#1A1A1F"/>
        <stop offset="45%" stop-color="#0B0B0E"/>
        <stop offset="100%" stop-color="#030304"/>
      </linearGradient>
      <linearGradient id="rim-black" x1="100" y1="10" x2="100" y2="190" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26"/>
        <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.06"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.01"/>
      </linearGradient>

      <!-- 2. 精密白瓷基底 -->
      <linearGradient id="bg-white" x1="100" y1="10" x2="100" y2="190" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="65%" stop-color="#F5F5F8"/>
        <stop offset="100%" stop-color="#E2E2E8"/>
      </linearGradient>
      <linearGradient id="rim-white" x1="100" y1="10" x2="100" y2="190" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
      </linearGradient>

      <!-- 3. 丝绸光学渐变 (Silk & Laser Gradients) -->
      <!-- 钛金激光蓝 -->
      <linearGradient id="p-laser" x1="45" y1="45" x2="155" y2="155" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="35%" stop-color="#38BDF8"/>
        <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
      </linearGradient>
      <!-- 熔岩琥珀 -->
      <linearGradient id="p-lava" x1="50" y1="45" x2="150" y2="155" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FDE047"/>
        <stop offset="45%" stop-color="#F97316"/>
        <stop offset="100%" stop-color="#EF4444"/>
      </linearGradient>
      <!-- 量子紫罗兰 -->
      <linearGradient id="p-quantum" x1="45" y1="45" x2="155" y2="155" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#F472B6"/>
        <stop offset="50%" stop-color="#A855F7"/>
        <stop offset="100%" stop-color="#4F46E5"/>
      </linearGradient>
      <!-- 极光祖母绿 -->
      <linearGradient id="p-mint" x1="50" y1="45" x2="150" y2="155" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#A7F3D0"/>
        <stop offset="45%" stop-color="#10B981"/>
        <stop offset="100%" stop-color="#047857" stop-opacity="0.3"/>
      </linearGradient>
      <!-- 铬合金高光 -->
      <linearGradient id="p-chrome" x1="60" y1="45" x2="140" y2="155" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="50%" stop-color="#A1A1AA"/>
        <stop offset="100%" stop-color="#27272A"/>
      </linearGradient>
      <!-- 柔和发光滤镜 -->
      <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="10" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>
        <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#bg-black)" stroke="url(#rim-black)" stroke-width="1.5"/>
        <rect x="48" y="48" width="104" height="104" rx="26" stroke="#27272A" stroke-width="4"/>
        <rect x="62" y="62" width="76" height="76" rx="20" stroke="url(#p-quantum)" stroke-width="5" transform="rotate(15 100 100)"/>
        <rect x="76" y="76" width="48" height="48" rx="14" stroke="url(#p-laser)" stroke-width="6" transform="rotate(30 100 100)"/>
        <circle cx="100" cy="100" r="8" fill="#FFFFFF"/>
      </svg>